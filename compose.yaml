services:
  anker:
    build: .
    image: anker-prime-autonomous:1.1.0
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "${SERVER_IP:?Set SERVER_IP in .env}:${WEB_PORT:-80}:8080"
    environment:
      SITE_ORIGINS: "${PUBLIC_URL:?Set PUBLIC_URL in .env}"
      TZ: "Europe/Moscow"
      DATA_DIR: "/data"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
