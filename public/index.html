<!doctype html><html lang="ru"><head><link rel="mask-icon" href="/safari-pinned-tab.svg" color="#00bfdc"><link rel="icon" type="image/png" sizes="32x32" href="/anker32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261013b"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12181c"><title>Anker Prime</title><link rel="stylesheet" href="/style.css?v=20261013"><script src="/app.js?v=20261013" defer></script></head><body>
<header><a class="brand" href="/">ANKER<span>PRIME</span></a><div class="status"><i id="dot"></i><span id="connection">Подключение…</span></div><a class="quiet nav-history" href="/history">Графики</a><a class="quiet nav-history" href="/setup">Аккаунт</a><button id="settings-open" class="quiet">Настройки <span aria-hidden="true">⚙</span></button></header>
<main><div class="heading"><select id="charger" aria-label="Зарядное устройство" hidden></select></div>
<div id="error" role="alert" hidden></div>
<section class="overview"><div class="total"><p>Общая мощность</p><div><strong id="total">—</strong><span>Вт</span></div><p id="thermal-status" class="thermal-state" role="status">Перегрев: нет данных</p><p id="active-count">Ожидаем данные зарядки</p></div><div class="allocation"><div class="row"><h2>Распределение мощности</h2><span id="budget">— / 250 Вт</span></div><div id="budget-bar" class="budget-bar"></div><div id="legend" class="legend"></div><p class="muted" id="budget-note">Лимиты портов действуют в пользовательском режиме.</p></div><div class="mode"><label for="mode">Режим зарядки</label><select id="mode"><option value="1">AI Power</option><option value="2">Приоритет подключения</option><option value="3">Два ноутбука</option><option value="4">Малая мощность</option><option value="5">Пользовательский</option></select><button id="profiles-open" class="secondary">Профили Anker</button></div></section>
<div class="section-heading"><h2>Порты</h2><button id="power-help" class="link" aria-label="О распределении мощности">ⓘ О мощности</button></div><section id="ports" class="ports"></section>
<footer><span id="updated">Данные из облака Anker</span></footer></main>
<dialog id="panel"><div class="dialog-head"><div><p class="eyebrow" id="panel-kicker">ANKER PRIME</p><h2 id="panel-title"></h2></div><button id="panel-close" class="icon-button" aria-label="Закрыть">×</button></div><div id="panel-body"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
